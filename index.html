<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="BillFect is coming soon." />
  <title>BillFect — Coming Soon</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      background: #f6f8fc;
      color: #172033;
    }

    .card {
      width: 100%;
      max-width: 680px;
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 24px;
      padding: 56px 32px 36px;
      text-align: center;
      box-shadow: 0 16px 45px rgba(0, 0, 0, 0.08);
    }

    .logo {
      font-size: 58px;
      font-weight: 800;
      letter-spacing: -3px;
      margin-bottom: 24px;
    }

    .logo span {
      color: #2563eb;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 34px;
    }

    p {
      margin: 0 auto;
      max-width: 500px;
      font-size: 18px;
      line-height: 1.6;
      color: #667085;
    }

    .status {
      display: inline-block;
      margin-top: 28px;
      padding: 10px 16px;
      border-radius: 999px;
      background: #eef4ff;
      color: #1d4ed8;
      font-size: 14px;
      font-weight: 600;
    }

    footer {
      margin-top: 42px;
      padding-top: 24px;
      border-top: 1px solid #e5e7eb;
      font-size: 14px;
      color: #667085;
    }

    footer a {
      color: #172033;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="logo">Bill<span>Fect</span></div>

    <h1>Coming Soon</h1>

    <p>
      We’re getting BillFect ready for launch.
      More information will be available here soon.
    </p>

    <div class="status">In development</div>

    <footer>
      <a href="/privacy/">Privacy Policy</a>
      &nbsp;·&nbsp;
      <a href="mailto:privacy@billfect.com">privacy@billfect.com</a>
    </footer>
  </div>
</body>
</html>
